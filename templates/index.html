<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Weather Forecast</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/style.css') }}"
    >
</head>

<body>

    <main class="app-container">

        <!-- Header -->
        <header class="header">

            <h1>Weather Forecast</h1>

            <p>
                Check the current weather and hourly forecast
            </p>

        </header>


        <!-- Search Section -->
        <section class="search-section">

            <!-- Search wrapper is required for dropdown -->
            <div class="search-wrapper">

                <div class="search-box">

                    <input
                        type="text"
                        id="searchInput"
                        placeholder="Enter city or location..."
                        autocomplete="off"
                    >

                    <button
                        id="searchButton"
                        type="button"
                    >
                        Search
                    </button>

                </div>


                <!-- Location Suggestions -->
                <div
                    id="suggestions"
                    class="suggestions hidden"
                ></div>

            </div>


            <!-- Temperature Unit -->
            <div class="unit-toggle">

                <button
                    id="celsiusButton"
                    class="unit-button active"
                    type="button"
                >
                    °C
                </button>

                <button
                    id="fahrenheitButton"
                    class="unit-button"
                    type="button"
                >
                    °F
                </button>

            </div>

        </section>


        <!-- Loading Message -->
        <div
            id="loadingMessage"
            class="message hidden"
        >
            Loading weather...
        </div>


        <!-- Error Message -->
        <div
            id="errorMessage"
            class="error-message hidden"
        ></div>


        <!-- Weather Content -->
        <section
            id="weatherContent"
            class="weather-content hidden"
        >

            <!-- Current Weather -->
            <div class="current-weather">

                <h2 id="cityName"></h2>

                <p
                    id="localTime"
                    class="local-time"
                ></p>

                <img
                    id="weatherIcon"
                    class="weather-icon"
                    src=""
                    alt="Weather condition"
                >

                <div
                    id="temperature"
                    class="temperature"
                ></div>

                <div
                    id="weatherCondition"
                    class="condition"
                ></div>

                <div
                    id="feelsLike"
                    class="feels-like"
                ></div>

            </div>


            <!-- Weather Details -->
            <div class="weather-details">

                <div class="detail-card">

                    <span>Humidity</span>

                    <strong id="humidity">
                        --
                    </strong>

                </div>


                <div class="detail-card">

                    <span>Wind</span>

                    <strong id="wind">
                        --
                    </strong>

                </div>


                <div class="detail-card">

                    <span>Sunrise</span>

                    <strong id="sunrise">
                        --
                    </strong>

                </div>


                <div class="detail-card">

                    <span>Sunset</span>

                    <strong id="sunset">
                        --
                    </strong>

                </div>

            </div>


            <!-- Hourly Forecast -->
            <section class="hourly-section">

                <h3>
                    Hourly Forecast
                </h3>

                <div
                    id="hourlyForecast"
                    class="hourly-container"
                ></div>

            </section>

        </section>

    </main>


    <script
        src="{{ url_for('static', filename='js/script.js') }}"
    ></script>

</body>

</html>
